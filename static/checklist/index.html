<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/checklist/icon.svg" sizes="32x32" />
    <link rel="apple-touch-icon" type="image/svg+xml" href="/checklist/icon.svg" sizes="96x96" />
    <title>Checklist App</title>
    <link rel="stylesheet" href="/checklist/style.css" />
    <link rel="manifest" href="/checklist/manifest.json" />    
    <script src="/checklist/db.js" defer></script>
    <script src="/checklist/script.js" defer></script>
</head>
<body>

    <div id="menu-area" class="container">
        <h1>Checklist App</h1>
        <div class="input-area">
            <input type="text" id="menuInput" placeholder="Enter a new checklist name...">
        </div>
        <ul id="menuList">
            <!-- List items will be added here by JavaScript -->
        </ul>
    </div>
    <div id="checklist-area" class="container d-none">
        <h1 id="checklistHeader">My Checklist</h1>
        <div class="header-actions">
            <button id="removeItemAllBtn" class="delete-btn">Remove all checked items</button>
            <button id="backToMenuBtn">Back</button>
        </div>
        <div class="input-area">
            <input type="text" id="itemInput" placeholder="Enter a new item...">
        </div>
        <ul id="checklist">
            <!-- List items will be added here by JavaScript -->
        </ul>
    </div>
</body>
</html>
